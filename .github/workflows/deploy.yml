# Personal repo (VirusPC/edges-brain-viruspc) deploy: /teaching/ only.
# PREREQUISITES before landing this (otherwise /tasks/ and /artifacts break):
#   1. nginx /tasks/ alias points at /home/cheng-dev/projects/edges-framework/tasks/_site/
#      (root edit of /etc/nginx/snippets/edges-tasks.conf; done once).
#   2. The artifacts-preview systemd user unit runs from edges-framework
#      (framework repo's deploy/edges-artifacts-preview.service changed from
#      %h/projects/edges to %h/projects/edges-framework, then the framework
#      Deploy re-runs `edges artifacts server install` + restart).
# After that, the framework Deploy (VirusPC/edges) owns: pnpm/extensions build,
# tasks/_site generation, the root-owned site-layout migrator, and the
# artifacts server. This workflow only fast-forwards the personal checkout.
#
# nginx serves /teaching/ as static files: `location /teaching/ { root
# /home/cheng-dev/projects/edges; try_files ... }`. That maps the URL onto
# <checkout>/teaching/index.html. This repo has no knowledge/ tree; the old
# knowledge/teaching root was migrated away. Nothing to build, so no
# Node/pnpm, no sudo, no system code needed in this repo.
# Secrets TEACH_DEPLOY_* live in the `production` environment of this repo.
# Keep: full-repo pull on ECS; do not rsync-push a path subset.
name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: ecs-edges-pull
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Public site URLs
        run: |
          {
            echo '## Public site URLs'
            echo
            echo '- [Teaching](https://edges.viruspc.tech/teaching/)'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Pull personal checkout on ECS
        env:
          TEACH_DEPLOY_HOST: ${{ secrets.TEACH_DEPLOY_HOST }}
          TEACH_DEPLOY_USER: ${{ secrets.TEACH_DEPLOY_USER }}
          TEACH_DEPLOY_SSH_KEY: ${{ secrets.TEACH_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${TEACH_DEPLOY_HOST:?missing secret TEACH_DEPLOY_HOST}"
          : "${TEACH_DEPLOY_USER:?missing secret TEACH_DEPLOY_USER}"
          : "${TEACH_DEPLOY_SSH_KEY:?missing secret TEACH_DEPLOY_SSH_KEY}"
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$TEACH_DEPLOY_SSH_KEY" > "$key"
          chmod 600 "$key"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H -T 10 "$TEACH_DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh -i "$key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "${TEACH_DEPLOY_USER}@${TEACH_DEPLOY_HOST}" \
            'set -euo pipefail
             cd /home/cheng-dev/projects/edges
             git remote set-url origin https://ghproxy.net/https://github.com/VirusPC/edges-brain-viruspc.git
             git fetch origin main
             git checkout main
             git reset --hard origin/main
             git --no-pager status -sb
             git rev-parse HEAD
             test -s teaching/index.html'

  site-teaching:
    needs: [deploy]
    runs-on: ubuntu-latest
    environment:
      name: teaching
      url: https://edges.viruspc.tech/teaching/
    steps:
      - name: Check teaching URL
        run: curl -fsS -o /dev/null --retry 3 --retry-delay 5 https://edges.viruspc.tech/teaching/
